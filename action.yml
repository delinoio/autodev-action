name: "AutoDev Action v0.1"
description: "Fully automated AI-powered development workflow for GitHub repositories."
branding:
  icon: 'archive'
  color: 'gray-dark'
  
inputs:
  prompt:
    description: "Instructions for AutoDev. Can be a direct prompt or custom template."
    required: true

  base_branch:
    description: "The branch to use as the base/source when creating new branches (defaults to repository default branch)"
    required: false

  autodev_mode:
    description: "The AutoDev execution mode. Can be 'develop' (default) or 'plan' (for task graph planning)"
    required: false
    default: 'develop'

  agent:
    description: "The agent to use for the action. Can be 'claude_cli', 'claude_code', 'gemini_cli', 'codex_cli', 'opencode', 'crush_cli', or 'github_copilot_cli'"
    required: true

  agent_model:
    description: "The (optional) model to use for the agent"
    required: false
    default: ''

  claude_code_oauth_token:
    description: "Claude Code OAuth token (alternative to anthropic_api_key)"
    required: false

  # For openai codex
  openai_api_key:
    description: "OpenAI API key"
    required: false

  # For Anthropic Claude models
  anthropic_api_key:
    description: "Anthropic API key for Claude models"
    required: false

  # For Google Gemini models
  gemini_api_key:
    description: "Google Gemini API key"
    required: false

  autodev_workflow_execution_token:
    description: "AutoDev workflow execution token"
    required: true

  delino_access_token:
    description: "Delino access token"
    required: true

runs:
  using: "composite"
  steps:
    # Prepare resources
    - name: Prepare
      id: prepare
      uses: delinoio/autodev-action/prepare@main
      with:
        agent: ${{ inputs.agent }}
        agent_model: ${{ inputs.agent_model }}
        autodev_mode: ${{ inputs.autodev_mode }}
        autodev_workflow_execution_token: ${{ inputs.autodev_workflow_execution_token }}
        base_branch: ${{ inputs.base_branch }}
        delino_access_token: ${{ inputs.delino_access_token }}

    # Run the AI agent
    - name: Run Claude Code
      if: inputs.agent == 'claude_code'
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}

        claude_args: |
          --allowed-tools 'Bash,Edit,Write,WebSearch,WebFetch'

        branch_prefix: 'autodev/'
        base_branch: ${{ inputs.base_branch }}
        github_token: ${{ steps.prepare.outputs.github_token }}
        use_sticky_comment: true

        prompt: |
          ${{ inputs.prompt }}
          
          ---

          Context:
            - Repository: ${{ github.repository }}
            - Base branch: ${{ inputs.base_branch }}
            - Use `autodev/` prefix for new branch names.


    - name: Run Codex
      if: inputs.agent == 'codex_cli'
      uses: openai/codex-action@main
      with:
        openai-api-key: ${{ inputs.openai_api_key }}
        sandbox: danger-full-access
        prompt: |
          ${{ inputs.prompt }}

          ---

          Context:
            - Repository: ${{ github.repository }}
            - Base branch: ${{ inputs.base_branch }}
            - Use `autodev/` prefix for new branch names.

    - name: Run Crush CLI
      if: inputs.agent == 'crush_cli'
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ steps.prepare.outputs.github_token }}
        CRUSH_MODEL: ${{ inputs.agent_model }}
      run: |
        set -e

        # Install Crush CLI via npm
        echo "Installing Crush CLI..."
        npm install -g @charmland/crush

        # Verify installation
        crush --version

        # Configure git
        git config --global user.email "autodev@delino.io"
        git config --global user.name "AutoDev Bot"

        # Create feature branch
        BRANCH_NAME="autodev/crush-cli-$(date +%s)"
        git checkout -b "$BRANCH_NAME"

        # Prepare the prompt
        PROMPT=$(cat <<'PROMPT_EOF'
        ${{ inputs.prompt }}

        ---

        Context:
          - Repository: ${{ github.repository }}
          - Base branch: ${{ inputs.base_branch }}
          - Use `autodev/` prefix for new branch names.

        IMPORTANT: After making changes, commit them with a descriptive message.
        PROMPT_EOF
        )

        # Execute Crush CLI in non-interactive mode
        echo "Running Crush CLI..."

        # Determine which API key to use based on model or default to first available
        if [ -n "$ANTHROPIC_API_KEY" ] && [ -z "$CRUSH_MODEL" -o "$CRUSH_MODEL" == *"claude"* ]; then
          export CRUSH_PROVIDER="anthropic"
          echo "Using Anthropic Claude provider"
        elif [ -n "$OPENAI_API_KEY" ] && [ -z "$CRUSH_MODEL" -o "$CRUSH_MODEL" == *"gpt"* -o "$CRUSH_MODEL" == *"openai"* ]; then
          export CRUSH_PROVIDER="openai"
          echo "Using OpenAI provider"
        elif [ -n "$GEMINI_API_KEY" ] && [ -z "$CRUSH_MODEL" -o "$CRUSH_MODEL" == *"gemini"* ]; then
          export CRUSH_PROVIDER="google"
          echo "Using Google Gemini provider"
        fi

        # Run Crush with the prompt
        # Note: Crush CLI execution details may need adjustment based on actual CLI interface
        echo "$PROMPT" | crush ${CRUSH_MODEL:+--model "$CRUSH_MODEL"} --non-interactive || {
          echo "Crush CLI execution completed with warnings or errors"
        }

        # Check if there are changes to commit
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "Changes detected, committing..."
          git add -A
          git commit -m "AutoDev: Crush CLI changes

          Generated by Crush CLI via AutoDev Action

          Prompt: ${{ inputs.prompt }}" || echo "No changes to commit"

          # Push the branch
          git push -u origin "$BRANCH_NAME"
          echo "Branch $BRANCH_NAME pushed successfully"
        else
          echo "No changes detected"
        fi



    # Run the postprocess
    - name: Postprocess
      uses: delinoio/autodev-action/postprocess@main
      with:
        agent: ${{ inputs.agent }}
        agent_model: ${{ inputs.agent_model }}
        autodev_mode: ${{ inputs.autodev_mode }}
        autodev_workflow_execution_token: ${{ inputs.autodev_workflow_execution_token }}
        base_branch: ${{ inputs.base_branch }}
        delino_access_token: ${{ inputs.delino_access_token }}
